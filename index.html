    <script>
        const SUPABASE_URL = 'https://nkcdbcsdudoaiajivyqk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5rY2RiY3NkdWRvYWlhaml2eXFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ0NTgxMDksImV4cCI6MjA4MDAzNDEwOX0.86w4MOrzxuZKTUJTElZ4kqD--VHdi6VX3gsq_6SVlVg';

        function toggleSubscriptionForm() {
            const form = document.getElementById('subscription-form');
            const button = document.getElementById('subscribe-button');
            const message = document.getElementById('subscription-message');

            if (form.classList.contains('hidden')) {
                form.classList.remove('hidden');
                button.classList.add('hidden');
                message.classList.add('hidden');
                document.getElementById('subscriber-name').value = '';
                document.getElementById('subscriber-email').value = '';
            } else {
                form.classList.add('hidden');
                button.classList.remove('hidden');
            }
        }

        async function submitSubscription() {
            const name = document.getElementById('subscriber-name').value.trim();
            const email = document.getElementById('subscriber-email').value.trim();
            const message = document.getElementById('subscription-message');
            const submitButton = event.target;

            if (!name || !email) {
                showMessage('Please fill in all fields', 'error');
                return;
            }

            if (!isValidEmail(email)) {
                showMessage('Please enter a valid email address', 'error');
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = 'Submitting...';

            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/send-subscription-email`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    },
                    body: JSON.stringify({ name, email })
                });

                if (!response.ok) {
                    throw new Error('Failed to send subscription');
                }

                const insertResponse = await fetch(`${SUPABASE_URL}/rest/v1/newsletter_subscriptions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'apikey': SUPABASE_ANON_KEY,
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ name, email })
                });

                if (!insertResponse.ok) {
                    const errorData = await insertResponse.json();
                    if (errorData.code === '23505') {
                        throw new Error('This email is already subscribed!');
                    }
                    throw new Error('Failed to save subscription');
                }

                showMessage('Successfully subscribed! Check your inbox.', 'success');
                setTimeout(() => {
                    toggleSubscriptionForm();
                }, 2000);

            } catch (error) {
                console.error('Subscription error:', error);
                showMessage(error.message || 'Failed to subscribe. Please try again.', 'error');
                submitButton.disabled = false;
                submitButton.textContent = 'Submit';
            }
        }

        function showMessage(text, type) {
            const message = document.getElementById('subscription-message');
            message.textContent = text;
            message.className = `text-xs text-center mt-2 ${type === 'success' ? 'text-accent-100' : 'text-yellow-200'}`;
            message.classList.remove('hidden');
        }

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function openAdvertiseModal() {
            document.getElementById('advertise-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeAdvertiseModal() {
            document.getElementById('advertise-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
            document.getElementById('advertise-form').reset();
            document.getElementById('ad-message').classList.add('hidden');
            toggleAdFields();
        }

        function toggleAdFields() {
            const type = document.querySelector('input[name="ad-type"]:checked').value;
            const productFields = document.getElementById('product-fields');
            const serviceFields = document.getElementById('service-fields');
            const productInput = document.getElementById('ad-product');
            const servicesInput = document.getElementById('ad-services');

            if (type === 'product') {
                productFields.classList.remove('hidden');
                serviceFields.classList.add('hidden');
                productInput.required = true;
                servicesInput.required = false;
            } else {
                productFields.classList.add('hidden');
                serviceFields.classList.remove('hidden');
                productInput.required = false;
                servicesInput.required = true;
            }
        }

        document.getElementById('advertise-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const type = document.querySelector('input[name="ad-type"]:checked').value;
            const companyName = document.getElementById('ad-company').value.trim();
            const productName = document.getElementById('ad-product').value.trim();
            const contactName = document.getElementById('ad-contact-name').value.trim();
            const contactEmail = document.getElementById('ad-email').value.trim();
            const contactPhone = document.getElementById('ad-phone').value.trim();
            const servicesProvided = document.getElementById('ad-services').value.trim();
            const websiteUrl = document.getElementById('ad-website').value.trim();
            const notes = document.getElementById('ad-notes').value.trim();
            const messageDiv = document.getElementById('ad-message');
            const submitButton = e.target.querySelector('button[type="submit"]');

            if (!isValidEmail(contactEmail)) {
                messageDiv.textContent = 'Please enter a valid email address';
                messageDiv.className = 'text-sm p-3 rounded-lg bg-red-100 text-red-700';
                messageDiv.classList.remove('hidden');
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = 'Submitting...';

            try {
                const adData = {
                    type,
                    company_name: companyName,
                    contact_name: contactName,
                    contact_email: contactEmail,
                    contact_phone: contactPhone || null,
                    website_url: websiteUrl || null,
                    notes: notes || null
                };

                if (type === 'product') {
                    adData.product_name = productName;
                } else {
                    adData.services_provided = servicesProvided;
                }

                const response = await fetch(`${SUPABASE_URL}/rest/v1/advertisements`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'apikey': SUPABASE_ANON_KEY,
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(adData)
                });

                if (!response.ok) {
                    throw new Error('Failed to submit advertisement request');
                }

                messageDiv.textContent = 'Thank you! Your advertisement request has been submitted successfully. We\'ll contact you soon!';
                messageDiv.className = 'text-sm p-3 rounded-lg bg-green-100 text-green-700';
                messageDiv.classList.remove('hidden');

                setTimeout(() => {
                    closeAdvertiseModal();
                }, 3000);

            } catch (error) {
                messageDiv.textContent = error.message || 'An error occurred. Please try again.';
                messageDiv.className = 'text-sm p-3 rounded-lg bg-red-100 text-red-700';
                messageDiv.classList.remove('hidden');
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Submit Advertisement Request';
            }
        });

        const feeds = {
            tech: ['https://feeds.feedburner.com/TechCrunch/', 'https://www.theverge.com/rss/index.xml'],
            finance: ['https://cointelegraph.com/rss', 'https://finance.yahoo.com/news/rssindex'],
            world: ['https://feeds.bbci.co.uk/news/world/rss.xml', 'https://rss.nytimes.com/services/xml/rss/nyt/World.xml']
        };

        const categories = [
            { id: 'all', label: 'All News' },
            { id: 'tech', label: 'Technology' },
            { id: 'finance', label: 'Finance' },
            { id: 'world', label: 'Global' }
        ];

        let currentCategory = 'all';
        const API_BASE = "https://api.rss2json.com/v1/api.json?rss_url=";

        document.addEventListener('DOMContentLoaded', () => {
            renderNav();
            loadNews('all');
        });

        function renderNav() {
            const desktopNav = document.getElementById('desktop-nav');
            const mobileNav = document.getElementById('mobile-menu');

            desktopNav.innerHTML = '';
            mobileNav.innerHTML = '';

            categories.forEach(cat => {
                const btnClasses = `px-4 py-2 rounded-full text-sm font-medium transition-all duration-200 ${cat.id === currentCategory ? 'bg-gradient-to-r from-brand-500 to-brand-600 text-white shadow-md' : 'text-slate-600 hover:text-brand-600 hover:bg-brand-50'}`;

                const btn = document.createElement('button');
                btn.innerText = cat.label;
                btn.className = btnClasses;
                btn.onclick = () => { updateActiveNav(cat.id); loadNews(cat.id); };
                desktopNav.appendChild(btn);

                const mBtn = document.createElement('button');
                mBtn.innerText = cat.label;
                mBtn.className = "block w-full text-left px-4 py-3 rounded-md hover:bg-brand-50 font-medium text-slate-700 transition-colors";
                mBtn.onclick = () => { document.getElementById('mobile-menu').classList.toggle('hidden'); updateActiveNav(cat.id); loadNews(cat.id); };
                mobileNav.appendChild(mBtn);
            });
        }

        function updateActiveNav(id) {
            currentCategory = id;
            renderNav();
        }

        async function loadNews(category) {
            const feedContainer = document.getElementById('news-feed');
            const statusLabel = document.getElementById('last-updated');

            feedContainer.innerHTML = `<div class="col-span-1 md:col-span-2 flex flex-col items-center justify-center py-20 text-slate-400"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-600 mb-4"></div><p class="text-slate-600 font-medium">Curating your feed...</p></div>`;

            let urls = category === 'all' ? Object.values(feeds).flat() : feeds[category];

            try {
                const promises = urls.map(url => fetch(API_BASE + encodeURIComponent(url)).then(res => res.json()));
                const results = await Promise.all(promises);

                let allItems = results
                    .filter(r => r.status === 'ok')
                    .flatMap(r => r.items.map(item => ({...item, sourceName: r.feed.title })))
                    .sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

                statusLabel.innerText = "Updated: " + new Date().toLocaleTimeString();
                renderCards(allItems);

            } catch (error) {
                console.error('Error loading feeds:', error);
                feedContainer.innerHTML = `<div class="col-span-1 md:col-span-2 p-8 bg-red-50 border border-red-200 rounded-xl text-center">
                    <p class="text-red-600 font-semibold mb-2">Error loading feeds</p>
                    <p class="text-sm text-red-500">Please check your internet connection and try again.</p>
                </div>`;
            }
        }

        function renderCards(items) {
            const container = document.getElementById('news-feed');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = `<div class="col-span-1 md:col-span-2 p-8 bg-yellow-50 border border-yellow-200 rounded-xl text-center">
                    <p class="text-yellow-700 font-semibold">No articles found for this category.</p>
                </div>`;
                return;
            }

            items.forEach((item, index) => {
                const imgUrl = item.thumbnail || item.enclosure?.link || `https://via.placeholder.com/600x300/e2e8f0/94a3b8?text=${encodeURIComponent(item.sourceName)}`;
                const dateStr = new Date(item.pubDate).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

                const card = document.createElement('article');
                card.className = "bg-white rounded-xl shadow-sm hover:shadow-xl hover:shadow-brand-100/50 transition-all duration-300 overflow-hidden border border-slate-100 hover:border-brand-200 flex flex-col group";
                card.innerHTML = `
                    <div class="relative overflow-hidden h-48 bg-slate-200">
                        <img src="${imgUrl}" alt="${item.title}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" onerror="this.src='https://via.placeholder.com/600x300/e2e8f0/94a3b8?text=News'">
                        <div class="absolute top-2 left-2 bg-white/90 backdrop-blur text-[10px] font-bold px-2 py-1 rounded shadow text-slate-700 uppercase tracking-wide">
                            ${item.sourceName}
                        </div>
                    </div>
                    <div class="p-5 flex flex-col flex-grow">
                        <div class="flex items-center text-xs text-slate-500 mb-2 font-medium">
                            <span class="text-brand-600 mr-2">● Live</span>
                            <span>${dateStr}</span>
                        </div>
                        <h3 class="font-bold text-slate-900 text-lg leading-tight mb-3 line-clamp-2 group-hover:text-brand-600 transition-colors duration-200">
                            <a href="${item.link}" target="_blank">${item.title}</a>
                        </h3>
                        <p class="text-slate-600 text-sm line-clamp-3 mb-4 flex-grow">
                            ${item.description.replace(/<[^>]*>?/gm, '').substring(0, 120)}...
                        </p>
                        <a href="${item.link}" target="_blank" class="inline-flex items-center text-sm font-semibold text-brand-600 hover:text-brand-700 transition-colors mt-auto">
                            Read Article
                            <svg class="w-4 h-4 ml-1 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
